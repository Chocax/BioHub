# CONTRAFACTUAL de la iteración 27 (no es la configuración de las corridas oficiales): igual que nginx-carga.conf, pero NGINX guarda
# en caché las fotos públicas (/api/publica/especies/fotos/{fotoId}), que son inmutables (D66). Sirve para medir cuánto mejora la
# portada si los bytes de las fotos se cachean fuera de MySQL (esto es lo que haría una caché de bytes: NGINX, un CDN, Redis o la
# memoria de la réplica). No lo usa ningún despliegue. Uso:
#   NGINX_CONF=./nginx-carga-cache-fotos.conf docker compose -p biohub-carga -f compose-carga.yml --env-file ../.env up -d --scale consulta-publica=2
worker_rlimit_nofile 65536;
events { worker_connections 8192; }
http {
  access_log off;
  proxy_cache_path /var/cache/nginx/fotos levels=1:2 keys_zone=fotos:10m max_size=200m inactive=1h use_temp_path=off;
  upstream consulta { server consulta-publica:8083 max_fails=0; keepalive 256; }
  server {
    listen 8080;
    location /api/publica/especies/fotos/ {
      proxy_pass http://consulta;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 2s; proxy_read_timeout 15s;
      proxy_cache fotos;
      proxy_cache_valid 200 1h;
      proxy_cache_lock on;                 # una sola petición al origen por foto (single-flight)
      add_header X-Cache $upstream_cache_status;
    }
    location / {
      proxy_pass http://consulta;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 2s; proxy_read_timeout 15s;
    }
    location = /nginx-ping { return 200 "ok\n"; }
  }
}
