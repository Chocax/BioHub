# Tema de inicio de sesión de BioHub (D64): la misma galería de la web interna sobre el tema keycloak.v2.
# Solo cambian el CSS y un script de fondos: la estructura, la accesibilidad y los textos siguen siendo los de Keycloak.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/biohub.css
# Fondos que se alternan (pinturas de dominio público, ver css/biohub.css)
scripts=js/fondos.js
# La galería es clara; sin esto, con el sistema en modo oscuro Keycloak pinta todo negro.
darkMode=false
