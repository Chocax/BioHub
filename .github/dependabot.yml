# Actualizaciones de dependencias. Los PR van a develop, una vez por semana y agrupados para no llenar el repo:
# un PR para lo menor (minor y patch) de cada ecosistema; lo mayor llega por separado para revisarlo con calma.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: America/Bogota }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      maven-menores: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directories: [/web-interna, /web-publica]
    target-branch: develop
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: America/Bogota }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-menores: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: monthly, timezone: America/Bogota }
    commit-message: { prefix: "chore(ci)" }
    groups:
      acciones: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/api-gateway, /servicio-cientifico, /servicio-consulta-publica, /servicio-equipos, /servicio-reportes]
    target-branch: develop
    schedule: { interval: monthly, timezone: America/Bogota }
    commit-message: { prefix: "chore(docker)" }
    groups:
      imagenes: { patterns: ["*"] }
