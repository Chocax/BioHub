<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP de la web interna. %API_ORIGEN% y %KEYCLOAK_ORIGEN% los pone vite.config.js con VITE_API_URL y
      VITE_KEYCLOAK_URL. Fotos, audios y teselas llegan como blob: (se piden con el JWT, no con <img src>).
      frame-ancestors no funciona en <meta>: va como cabecera HTTP del servidor que la publique (ver README).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' %API_ORIGEN% %KEYCLOAK_ORIGEN%; frame-src %KEYCLOAK_ORIGEN%; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d0d0c" />
    <title>BioHub · Interna</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
